# Keeps the game-play counter's allowlist in sync with the repo.
#
# The allowlist lives inside a Postgres function, so shipping a game was always
# a two-place change — and Softball Stars launched uncounted because the second
# place got missed. This closes that: merging to main applies the SQL.
#
# Needs one repo secret, SUPABASE_ACCESS_TOKEN (Supabase → Account → Access
# Tokens). Without it the job warns and skips rather than failing the deploy.
name: Sync game-play allowlist

on:
  push:
    branches: ['main']
    paths:
      - 'supabase/create_game_play_counts.sql'
      - 'scripts/apply-play-allowlist.mjs'
      - '.github/workflows/sync-play-allowlist.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-allowlist
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply and verify the allowlist
        run: node scripts/apply-play-allowlist.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
