name: Daily Resilience Backup

on:
  schedule:
    - cron: '0 1 * * *' # Run at 01:00 AM daily
  workflow_dispatch: # Allow manual triggering

jobs:
  sync_and_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the snapshot is kept as a dated artifact, not pushed to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        # Data sync never launches a browser; skip puppeteer's download.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Resilience Data Sync
        # Supabase only: Appwrite is no longer used. The public anon key reads
        # public content (events, published stories) — nothing private.
        env:
          DATABASE_PROVIDER: supabase
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run fetch-data

      # main only takes changes through the merge queue, so a direct push is
      # refused (GH013). Keep each night's snapshot as a dated download instead:
      # 90 days of history, and every deploy refetches it for the live site anyway.
      - name: Save snapshot as a backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: resilience-backup-${{ github.run_number }}
          path: data/resilience_data.ts
          retention-days: 90
          if-no-files-found: error
