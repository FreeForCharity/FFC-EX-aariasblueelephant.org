<!-- © 2026 Aaria's Blue Elephant · aariasblueelephant.org
     A Thanksgiving card: a 30-second film in five scenes, drawn in SVG in the
     badge's style, opened from an envelope and played in one stretch.
     Sensory-friendly: no sound, nothing flashes, and with "reduce motion" on
     the scenes simply fade from one still to the next.
     Bilingual EN/ES via localStorage 'abe.lang' (shared with the site); the
     Spanish is AI-translated (see the general disclosure).
     Built by Aaria and her Friends 💙 -->
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="card.css">
</head>
<body>
<main id="card">
  <header id="top">
    <img src="/abe-logo-badge.png" alt="">
    <span id="eyebrow"></span>
  </header>
  <div id="frame">
    <div id="scenes" role="img"></div>
    <div id="cover"></div>
  </div>
  <div id="bar">
    <button id="pp" type="button"></button>
    <div id="prog"></div>
    <button id="again" type="button"></button>
    <button id="lang" type="button"></button>
  </div>
  <div id="cap" aria-live="polite"></div>
</main>
<footer id="foot">
  <span>Built by Aaria and her Friends 💙</span>
  <a href="/">aariasblueelephant.org</a>
  <a href="/legal/disclosure.html" target="_blank" rel="noopener">General Disclosure / Aviso general</a>
</footer>
<script src="art/sizes.js"></script>
<script src="card.js"></script>
</body>
