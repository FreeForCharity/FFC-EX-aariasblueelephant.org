<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Donate — Aaria's Blue Elephant</title>
  <!--
    SHORT DONATE LINK: aariasblueelephant.org/give  (for QR codes only — not in the nav)

    >>> TO SWITCH DONATION PLATFORMS, CHANGE THE URL IN THESE TWO PLACES IN THIS FILE: <<<
      1. the <meta http-equiv="refresh"> tag just below
      2. the <a id="go" href="..."> link in the body (the script reads its target from here)

    GitHub Pages can't send a server-side 301, so this static page is the redirect:
    meta refresh (works without JS) + JS replace() that also carries any ?query
    (e.g. ?utm_source=banner) + a visible link if both fail.
    /give and /give/ both land here (Pages adds the trailing slash itself).
    The /donate page (donation info for site visitors) is separate and untouched.
  -->
  <meta http-equiv="refresh" content="0; url=https://www.zeffy.com/en-US/donation-form/aariasblueelephant" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0F172A; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           text-align: center; padding: 24px; }
    a { color: #22D3EE; font-weight: 700; }
  </style>
</head>
<body>
  <p>
    <span id="msg">Taking you to our donation page…</span><br /><br />
    <a id="go" href="https://www.zeffy.com/en-US/donation-form/aariasblueelephant"><span id="cta">Click here to donate</span></a>
  </p>
  <script>
    (function () {
      var isEs = false;
      try { isEs = localStorage.getItem('abe.lang') === 'es'; } catch (e) {}
      if (isEs) {
        document.documentElement.lang = 'es';
        document.getElementById('msg').textContent = 'Llevándote a nuestra página de donaciones…';
        document.getElementById('cta').textContent = 'Haz clic aquí para donar';
      }
      var link = document.getElementById('go');
      var target = link.getAttribute('href');
      // carry through ?utm_source=… etc.
      link.setAttribute('href', target + (target.indexOf('?') < 0 ? location.search : location.search.replace(/^\?/, '&')));
      window.location.replace(link.getAttribute('href'));
    })();
  </script>
</body>
</html>
