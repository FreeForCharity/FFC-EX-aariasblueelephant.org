<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0F172A" />
  <title>Support Aaria's Blue Elephant</title>
  <!--
    SHORT DONATE LINK: aariasblueelephant.org/give  (for QR codes only — not in the nav)
    Same fun splash as the /card page (logo pop + confetti burst), ~1.6 s, then straight to the donation form.
    A big "Donate with Zeffy" button is visible from the first moment; tapping anywhere skips.

    >>> TO SWITCH DONATION PLATFORMS, CHANGE THE URL IN THESE THREE PLACES IN THIS FILE: <<<
      1. the DONATE_URL constant in the <script> at the bottom
      2. the href of <a id="go"> (the big button)
      3. the <noscript> meta refresh (the no-JavaScript failsafe)
    (The button label says "Zeffy" — update it in the HTML and the Spanish string too.)

    prefers-reduced-motion: no confetti/pop, static logo, redirect after 1 s. No sound.
    GitHub Pages can't send a server-side 301, which is why this is a static page.
    Logo: downsized copy of /card/assets/logo.png (kept small for mobile data).
  -->
  <noscript><meta http-equiv="refresh" content="3; url=https://www.zeffy.com/en-US/donation-form/aariasblueelephant" /></noscript>
  <style>
    :root { --dark: #0F172A; --gold: #FBBF24; --muted: #94A3B8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--dark);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* soft brand glow blobs, same as /card */
    body::before, body::after {
      content: ""; position: fixed; width: 320px; height: 320px; border-radius: 50%;
      filter: blur(90px); pointer-events: none;
    }
    body::before { top: -80px; left: -80px; background: rgba(34, 211, 238, 0.18); }
    body::after { bottom: -80px; right: -80px; background: rgba(244, 114, 182, 0.14); }

    .stage {
      position: relative; z-index: 1;
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px 24px 130px; text-align: center;
    }
    .logo {
      width: 140px; height: 140px;
      border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.25);
      opacity: 0;
      animation: logoPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes logoPopIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      margin: 0; font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 800; color: var(--gold);
      letter-spacing: -.01em; line-height: 1.1;
      opacity: 0; animation: fadeUp .5s ease-out .35s forwards;
    }
    .sub {
      margin: 0; font-size: clamp(1rem, 4.4vw, 1.2rem); color: #E2E8F0;
      opacity: 0; animation: fadeUp .5s ease-out .55s forwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Big, always-visible donate button */
    .give-btn {
      position: fixed; z-index: 2;
      left: 20px; right: 20px;
      bottom: max(24px, env(safe-area-inset-bottom));
      max-width: 440px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 18px 22px; border-radius: 18px;
      background: var(--gold); color: #0F172A;
      font: 800 1.2rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .give-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .logo, h1, .sub { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="logo" id="logo" src="logo.png" width="140" height="140" alt="Aaria's Blue Elephant" />
    <h1 id="l1">Every Star Shines.</h1>
    <p class="sub" id="l2">Your gift makes it possible. 💙</p>
    <a class="give-btn" id="go" href="https://www.zeffy.com/en-US/donation-form/aariasblueelephant" aria-label="Donate now with Zeffy" data-aria-es="Donar ahora con Zeffy"><span id="btn">Donate with Zeffy →</span></a>
  </main>

  <script>
    (function () {
      // ── DONATION FORM URL — change here (and in the two other spots noted in the head comment) ──
      var DONATE_URL = 'https://www.zeffy.com/en-US/donation-form/aariasblueelephant';
      var PLAY_MS = 1600;        // how long the splash plays before auto-redirect
      // ───────────────────────────────────────────────────────────────────────────────────────────

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var isEs = false;
      try { isEs = localStorage.getItem('abe.lang') === 'es'; } catch (e) {}

      var go = document.getElementById('go');
      if (isEs) {
        document.documentElement.lang = 'es';
        document.title = "Apoya a Aaria's Blue Elephant";
        document.getElementById('btn').textContent = 'Donar con Zeffy →';
        go.setAttribute('aria-label', go.getAttribute('data-aria-es'));
        document.getElementById('l1').textContent = 'Cada estrella brilla.';
        document.getElementById('l2').textContent = 'Tu donación lo hace posible. 💙';
      }

      // keep ?utm_source=… etc. on the way to the donation form
      var target = DONATE_URL + (location.search ? (DONATE_URL.indexOf('?') < 0 ? location.search : '&' + location.search.slice(1)) : '');
      go.setAttribute('href', target);

      var done = false, timer;
      function leave() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.location.replace(target);   // replace: Back returns to where they came from, not here
      }
      go.addEventListener('click', function (e) { e.preventDefault(); leave(); });
      document.addEventListener('click', leave);   // tap anywhere skips straight to the form

      // Confetti burst — same as the /card splash
      function fireConfettiBurst(x, y) {
        var canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150';
        document.body.appendChild(canvas);
        var dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
        var colors = ['#00BFFF', '#FFD700', '#FF1493', '#00FF7F', '#9370DB', '#FFA500', '#FF69B4'];
        var particles = [], running = false;

        function make() {
          return { x: x, y: y, vx: Math.random() * 8 - 4, vy: Math.random() * -10 - 5,
                   size: Math.random() * 12 + 4, color: colors[Math.floor(Math.random() * colors.length)],
                   life: 1, decay: 0.014 };
        }
        function tick() {
          ctx.clearRect(0, 0, w, h);
          for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            if (p.y > h + p.size || p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
          }
          if (particles.length) requestAnimationFrame(tick); else { running = false; canvas.remove(); }
        }
        function wave() { for (var i = 0; i < 22; i++) particles.push(make()); if (!running) { running = true; tick(); } }
        wave(); setTimeout(wave, 200);
      }

      if (!reduce) {
        setTimeout(function () {
          var r = document.getElementById('logo').getBoundingClientRect();
          fireConfettiBurst(r.left + r.width * 0.5, r.top + r.height * 0.66);
        }, 350);
      }

      timer = setTimeout(leave, reduce ? 1000 : PLAY_MS);
    })();
  </script>
</body>
</html>
