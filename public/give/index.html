<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1437" />
  <title>Support Aaria's Blue Elephant</title>
  <!--
    SHORT DONATE LINK: aariasblueelephant.org/give  (for QR codes only — not in the nav)
    A calm ~6.5 s story, then straight to the donation form:
      "Every child is a star" → the logo glows dim → "Every event is 100% free" →
      the logo is lit warm gold ("Your gift helps them shine") → redirect.
    A big "Donate with Zeffy" button is visible from the first moment, and tapping
    anywhere skips the animation and goes straight to Zeffy.

    >>> TO SWITCH DONATION PLATFORMS, CHANGE THE URL IN THESE THREE PLACES IN THIS FILE: <<<
      1. the DONATE_URL constant in the <script> at the bottom
      2. the href of <a id="go"> (the big button)
      3. the <noscript> meta refresh (the no-JavaScript failsafe)
    (The button label says "Zeffy" — update it in the HTML and the Spanish string too.)
    To change how long the story plays, edit PLAY_MS in the script (and the CSS delays).

    Sensory-safe: no sound, no flashing, slow easing, only gentle fades and glows.
    prefers-reduced-motion gets a fully static page and a 1 s redirect.
    GitHub Pages can't send a server-side 301, which is why this is a static page.
    Logo: downsized copy of /card/assets/logo.png (kept small for mobile data).
  -->
  <noscript><meta http-equiv="refresh" content="4; url=https://www.zeffy.com/en-US/donation-form/aariasblueelephant" /></noscript>
  <style>
    :root { --gold: #FBBF24; --night: #0B1437; --night2: #16245C; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 36%, var(--night2) 0%, var(--night) 70%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .stage {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 130px;
      text-align: center;
    }

    /* Background stars: fade in one by one, then breathe slowly (no flashing) */
    .star {
      position: absolute;
      width: var(--s); height: var(--s);
      background: var(--gold);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0;
      animation: starIn 1.2s ease-out var(--d) forwards, breathe 4.5s ease-in-out calc(var(--d) + 1.2s) infinite;
    }
    @keyframes starIn { from { opacity: 0; } to { opacity: .6; } }
    @keyframes breathe { 0%, 100% { opacity: .6; } 50% { opacity: .35; } }

    /* The logo is "a child who hasn't been lit yet" — dim at first, then glows warm */
    .logo-wrap { position: relative; width: min(52vw, 190px); aspect-ratio: 1; margin-bottom: 26px; }
    .halo {
      position: absolute; inset: -42%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251,191,36,.5) 0%, rgba(251,191,36,.18) 38%, rgba(251,191,36,0) 68%);
      opacity: 0;
      transform: scale(.7);
      animation: haloIn 1.8s ease-in-out 2.7s forwards;
    }
    @keyframes haloIn { to { opacity: 1; transform: scale(1); } }
    .logo {
      position: relative;
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
      opacity: .5;
      filter: brightness(.55) saturate(.5);
      transform: scale(.94);
      animation:
        logoIn 1.1s cubic-bezier(.22,.61,.36,1) .15s backwards,
        logoLight 1.8s ease-in-out 2.7s forwards;
    }
    @keyframes logoIn { from { opacity: 0; transform: scale(.85); } }
    @keyframes logoLight {
      from { opacity: .5; filter: brightness(.55) saturate(.5); transform: scale(.94); }
      to   { opacity: 1;  filter: brightness(1) saturate(1);    transform: scale(1.04); }
    }

    /* A few warm sparkles rise gently when the light arrives — not confetti */
    .spark {
      position: absolute; left: 50%; top: 50%;
      width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      animation: spark 1.8s ease-out var(--sd) forwards;
    }
    @keyframes spark {
      0% { opacity: 0; transform: translate(0,0) scale(.6); }
      30% { opacity: .85; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
    }

    /* Story captions share one spot and cross-fade */
    .caps { display: grid; width: 100%; max-width: 22em; }
    .caps > * { grid-area: 1 / 1; align-self: center; margin: 0; opacity: 0; }
    .cap { font-size: clamp(1.25rem, 5.6vw, 1.7rem); line-height: 1.35; font-weight: 600; color: #E2E8F0; }
    .cap-a { animation: capShow 1.6s ease-in-out .4s both; }
    .cap-b { animation: capShow 1.6s ease-in-out 2.0s both; }
    @keyframes capShow { 0% { opacity: 0; transform: translateY(6px); } 20%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .finale { animation: finaleIn 1s ease-out 3.6s forwards; }
    @keyframes finaleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .finale h1 { margin: 0 0 10px; font-size: clamp(2.1rem, 9.5vw, 3.1rem); font-weight: 800; color: var(--gold); letter-spacing: -.01em; line-height: 1.1; }
    .finale p { margin: 0; font-size: clamp(1.1rem, 4.8vw, 1.35rem); line-height: 1.45; color: #F1F5F9; }

    /* Big, always-visible donate button — thumb-reachable, from the very first moment */
    .give-btn {
      position: fixed;
      left: 20px; right: 20px;
      bottom: max(24px, env(safe-area-inset-bottom));
      max-width: 440px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 18px 22px;
      border-radius: 18px;
      background: var(--gold);
      color: #0B1437;
      font: 800 1.2rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-decoration: none;
      box-shadow: 0 0 0 0 rgba(251,191,36,.45), 0 8px 24px rgba(0,0,0,.35);
      animation: btnGlow 3.2s ease-in-out 1s infinite;   /* slow soft glow, no flashing */
    }
    @keyframes btnGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,.4), 0 8px 24px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 10px rgba(251,191,36,0), 0 8px 24px rgba(0,0,0,.35); } }
    .give-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* Reduced motion: fully static page, nothing animates */
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: .55; }
      .halo { animation: none; opacity: 1; transform: none; }
      .logo { animation: none; opacity: 1; filter: none; transform: none; }
      .cap { display: none; }
      .finale { animation: none; opacity: 1; transform: none; }
      .spark { display: none; }
      .give-btn { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div id="stars" aria-hidden="true"></div>

    <div class="logo-wrap">
      <div class="halo" aria-hidden="true"></div>
      <img class="logo" src="logo.png" width="220" height="220" alt="Aaria's Blue Elephant" />
      <div id="sparks" aria-hidden="true"></div>
    </div>

    <div class="caps">
      <p class="cap cap-a" id="ca">Every child is a star.</p>
      <p class="cap cap-b" id="cb">Every event is 100% free for every family.</p>
      <div class="finale">
        <h1 id="f1">Every Star Shines.</h1>
        <p id="f2">Your gift helps them shine. 💙</p>
      </div>
    </div>

    <a class="give-btn" id="go" href="https://www.zeffy.com/en-US/donation-form/aariasblueelephant" aria-label="Donate now with Zeffy" data-aria-es="Donar ahora con Zeffy"><span id="btn">Donate with Zeffy →</span></a>
  </main>

  <script>
    (function () {
      // ── DONATION FORM URL — change here (and in the two other spots noted in the head comment) ──
      var DONATE_URL = 'https://www.zeffy.com/en-US/donation-form/aariasblueelephant';
      var PLAY_MS = 6500;        // how long the story plays before auto-redirect
      // ───────────────────────────────────────────────────────────────────────────────────────────

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var isEs = false;
      try { isEs = localStorage.getItem('abe.lang') === 'es'; } catch (e) {}

      var go = document.getElementById('go');
      if (isEs) {
        document.documentElement.lang = 'es';
        document.title = "Apoya a Aaria's Blue Elephant";
        document.getElementById('btn').textContent = 'Donar con Zeffy →';
        go.setAttribute('aria-label', go.getAttribute('data-aria-es'));
        document.getElementById('ca').textContent = 'Cada niño es una estrella.';
        document.getElementById('cb').textContent = 'Cada evento es 100% gratis para cada familia.';
        document.getElementById('f1').textContent = 'Cada estrella brilla.';
        document.getElementById('f2').textContent = 'Tu donación les ayuda a brillar. 💙';
      }

      // keep ?utm_source=… etc. on the way to the donation form
      var target = DONATE_URL + (location.search ? (DONATE_URL.indexOf('?') < 0 ? location.search : '&' + location.search.slice(1)) : '');
      go.setAttribute('href', target);

      var done = false, timer;
      function leave() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.location.replace(target);   // replace: Back returns to where they came from, not here
      }
      go.addEventListener('click', function (e) { e.preventDefault(); leave(); });
      document.addEventListener('click', leave);   // tap anywhere skips straight to the form

      // [left %, top %, size px, fade-in delay s] — spread around, kept clear of the centre
      var pts = [[8,12,10,.1],[72,9,8,.3],[24,26,7,.5],[80,24,9,.7],[9,48,8,.9],[92,44,10,.4],
                 [14,70,9,.6],[86,66,8,.8],[30,84,7,1.0],[70,82,10,1.1],[50,5,7,.2],[48,92,8,1.2]];
      var h = '';
      pts.forEach(function (p) {
        h += '<i class="star" style="left:' + p[0] + '%;top:' + p[1] + '%;--s:' + p[2] + 'px;--d:' + p[3] + 's"></i>';
      });
      document.getElementById('stars').innerHTML = h;

      if (!reduce) {   // warm sparkles rise when the logo lights up (~2.8 s in)
        var sh = '';
        for (var i = 0; i < 9; i++) {
          var a = (i / 9) * Math.PI * 2 - Math.PI / 2, r = 100 + (i % 3) * 14;
          sh += '<i class="spark" style="--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r - 14) +
                'px;--sd:' + (2.8 + (i % 3) * 0.2).toFixed(2) + 's"></i>';
        }
        document.getElementById('sparks').innerHTML = sh;
      }

      timer = setTimeout(leave, reduce ? 1000 : PLAY_MS);
    })();
  </script>
</body>
</html>
